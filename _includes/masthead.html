<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a data-language-section="home" href="#about-me-en">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a data-language-section="{{ forloop.index0 }}" href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="language-switch" aria-label="Language selector">
        <button type="button" data-language-choice="en" aria-pressed="true">EN</button>
        <button type="button" data-language-choice="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </div>
</div>
